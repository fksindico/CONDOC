[project]
name = "condc-core"
version = "0.1.0"
description = "Core Backend e API REST do sistema CONDOC"
authors = [{ name = "CONDOC Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<5.2.0",
    "djangorestframework>=3.15.0,<3.16.0",
    "django-cors-headers>=4.4.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "gotrue>=2.9.0",
    "storage3>=0.7.0",
    "pytesseract>=0.3.10",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "django-stubs>=5.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.ruff]
line-length = 100
target-version = "py312"
